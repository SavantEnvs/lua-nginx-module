daemon off;
master_process off;
worker_processes 1;
error_log @TMP@/error.log info;
pid @TMP@/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path @TMP@/body;
    proxy_temp_path @TMP@/proxy;
    fastcgi_temp_path @TMP@/fastcgi;
    uwsgi_temp_path @TMP@/uwsgi;
    scgi_temp_path @TMP@/scgi;
    lua_package_path "@CORE@/lib/?.lua;@LRU@/lib/?.lua;;";

    server {
        listen 127.0.0.1:@PORT@;

        location = /b64enc {
            content_by_lua_block { ngx.say(ngx.encode_base64(ngx.var.arg_s)) }
        }
        location = /b64dec {
            content_by_lua_block { ngx.say(ngx.decode_base64(ngx.var.arg_s)) }
        }
        location = /unesc {
            content_by_lua_block { ngx.say(ngx.unescape_uri(ngx.var.arg_s)) }
        }
        location = /esc {
            content_by_lua_block { ngx.say(ngx.escape_uri("a b&c/d")) }
        }
        location = /match {
            content_by_lua_block {
                local m = ngx.re.match("abc 123-xyz", [[(\d+)-(\w+)]], "jo")
                ngx.say(m[0], "|", m[1], "|", m[2])
            }
        }
        location = /gsub {
            content_by_lua_block {
                local s, n = ngx.re.gsub("hello world", "(o)", "[$1]")
                ngx.say(s, " ", n)
            }
        }
        location = /args {
            content_by_lua_block {
                local t = ngx.decode_args("a=1&b=2&c=hello%20world")
                ngx.say(t.a, ",", t.b, ",", t.c)
            }
        }
        location = /time {
            content_by_lua_block {
                local s = ngx.http_time(1700000000)
                ngx.say(s, " ", ngx.parse_http_time(s))
            }
        }
        location = /md5 {
            content_by_lua_block { ngx.say(ngx.md5("hello")) }
        }
        location = /lexer {
            content_by_lua_block {
                local s = "}{" -- } {
                ngx.say(s, [==[ ]] }]==])
            }
        }
    }
}
